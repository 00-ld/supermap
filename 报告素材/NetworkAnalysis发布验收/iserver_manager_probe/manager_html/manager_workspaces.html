<script>
    var Sys = {};
    var ua = navigator.userAgent.toLowerCase();
    var ieResult = ua.match(/msie ([\d.]+)/i);
    var ffResult = ua.match(/firefox\/([\d.]+)/i);
    var chromeResult = ua.match(/chrome\/([\d.]+)/i);
    var operaResult = ua.match(/opera.([\d.]+)/i);
    var safariResult = ua.match(/version\/([\d.]+)/i);
    var captchaEnable = false;
    var captchaConfig;
    var captchaTicket = "";
    var lastRefreshTime;
    var isChecking = true;
    var passwordInput = document.getElementById("password");
    var usernameInput = document.getElementById("username");
    var loginButton = document.getElementById("loginButton");
    passwordInput.addEventListener('input',updateButtonStatus);
    usernameInput.addEventListener('input',updateButtonStatus);
    window.ActiveXObject && ieResult ? Sys.ie = ieResult[1] :
        document.getBoxObjectFor && ffResult ? Sys.firefox = ffResult[1] :
            window.MessageEvent && !document.getBoxObjectFor && chromeResult ? Sys.chrome = chromeResult[1] :
                window.opera && operaResult ? Sys.opera = operaResult[1] :
                    window.openDatabase && safariResult ? Sys.safari = safariResult[1] : 0;
    var theme = JSON.parse(localStorage.getItem("pro__DEFAULT_THEME"));
    var themeValue = theme ? theme.value : "light";
    var body = document.body;
    body.classList.remove("light", "dark");
    body.classList.add(themeValue);
    loadLoginPage();

    var url = "http://8.130.175.232:18090/iserver/services/security/../../manager/static/img/bgLogin-1-" + themeValue + ".png";
    document.body.style.backgroundImage = "url(" + url + ")";
    var docurl = "http://8.130.175.232:18090/iserver/services/security/../../manager/static/img/doc-" + themeValue + ".png";
    var help = document.getElementsByClassName("help")[0].getElementsByTagName("img")[0];
    help.src = docurl;
    var loginLogoPic = document.getElementsByClassName("loginLogoPic")[0];
    loginLogoPic.src = "http://8.130.175.232:18090/iserver/services/security/../../manager/static/img/iServer_login_logo_" + themeValue + ".png";

    var loginErrorPic= document.getElementsByClassName("loginErrorPic")[0];
    loginErrorPic.src = "http://8.130.175.232:18090/iserver/services/security/../../manager/static/img/error-" + themeValue + ".svg";
    //获取input框内的切换图片id和input文本框的id
    var demoImg = document.getElementById("showText");
    var demoInput = document.getElementById("password");

    demoImg.src = "http://8.130.175.232:18090/iserver/services/security/../../manager/static/img/pwhide-" + themeValue + ".svg";
    function updateButtonStatus(){
        if(passwordInput.value===''||usernameInput.value===''){
            loginButton.disabled=true;
        }else{
            loginButton.disabled=false;
        }
    }
    function loadLoginPage(){
        var loginPage = document.getElementById("loginPage");
        loginPage.style.height = window.getComputedStyle(document.getElementById("pageContent")).height;
        loginPage.style.top = 0;
        loginPage.style.left = 0;
        loginPage.style.bottom = 0;
        loginPage.style.right = 0;
    }
    function hideShowPsw() {
        if (demoInput.type == "password") {
            demoInput.type = "text";
            demoImg.src = "http://8.130.175.232:18090/iserver/services/security/../../manager/static/img/pwhide-" + themeValue + ".svg";
        } else {
            demoInput.type = "password";
            demoImg.src = "http://8.130.175.232:18090/iserver/services/security/../../manager/static/img/pwshow-" + themeValue + ".svg";
            ;
        }
    }
    function loadLoginPage(){
        var loginPage = document.getElementById("loginPage");
        loginPage.style.height = window.getComputedStyle(document.getElementById("pageContent")).height;
        loginPage.style.top = 0;
        loginPage.style.left = 0;
        loginPage.style.bottom = 0;
        loginPage.style.right = 0;
    }
    function selectLanguage(language) {
        delCookie("language");
        setCookie("language", language, 3600 * 24 * 31);
        window.location.reload();
    };

    //设置语言...开始
    function setCookie(c_name, value, expiredays) {
        var exdate = new Date()
        exdate.setDate(exdate.getDate() + expiredays)
        var protocol = window.location.protocol;
        var secure = "";
        if (protocol === "https:") {
            secure = ";secure=true";
        }
        cookieVal = c_name + "=" + escape(value) + ((expiredays == null) ? "" : ";expires=" + exdate.toGMTString()) + ";path=/" + secure;
        document.cookie = cookieVal;
    };

    function delCookie(name) {
        var date = new Date();
        date.setTime(date.getTime() - 10000);
        document.cookie = name + "=a;expires=" + date.toGMTString() + ";path=/";
    }

    function keyDown() {
    };
    document.onkeydown = keyDown;

    function keyDown(e) {
        if (navigator.appName == "Microsoft Internet Explorer") {
            var keycode = event.keyCode;

        } else {
            var keycode = e.which;
        }
        if (keycode == 13) {
            if (captchaEnable && isChecking) {
                var captchaInput = document.getElementById('captcha-input');
                var captchaItem = document.getElementById('captcha-error');
                captchaInputChange(captchaConfig, captchaInput, captchaItem);
            }
            document.getElementById('loginButton').click();
            return false;
        }
    }

    function correctPNG() {
        for (var i = 0; i < document.images.length; i++) {
            var img = document.images[i];
            var imgName = img.src.toUpperCase();
            if (imgName.substring(imgName.length - 3, imgName.length) == "PNG") {
                var imgID = (img.id) ? "id='" + img.id + "'" : "";
                var imgClass = (img.className) ? "class='" + img.className + "'" : "";
                var imgTitle = (img.title) ? "title='" + img.title + "'" : "title='" + img.alt + "'";
                var imgStyle = "display:inline-block;" + img.style.cssText;
                if (img.align == "left") imgStyle = "float:left;" + imgStyle;
                if (img.align == "right") imgStyle = "float:right;" + imgStyle;
                if (img.parentElement.href) imgStyle = "cursor:hand;" + imgStyle;
                var strNewHTML = "<span " + imgID + imgClass + imgTitle + "style=\"" + "width:" + img.width + "px; height:" + img.height + "px;"
                    + imgStyle + ";" + "filter:progid:DXImageTransform.Microsoft.AlphaImageLoader" + "(src=\'" + img.src + "\', sizingMethod='scale');\"</span>"
                img.outerHTML = strNewHTML;
                i = i - 1;
            }
            ;
        }
        ;
    };

    if (Sys.ie && Sys.ie < 7.0) {
        window.attachEvent("onload", correctPNG);
    }

    async function login() {
        var url = "http://8.130.175.232:18090/iserver/services/security/login.json";
        url = convertUrl(url);
        var loginError = document.getElementById("loginError");
        var msg= loginError.getElementsByTagName("span")[0];


        msg.textContent = "";
        var entity = {};
        entity.username = document.getElementById("username").value;
        if (entity.username == null || entity.username.length <= 0) {
            msg.textContent = "User name can not be null";
            loginError.style.visibility = "visible";
            $("#loginError").fadeTo(0,1);
            $("#loginError").fadeOut(5000);
            $("#loginError").fadeTo(100,0);
            $(msg).show();
            return false;
        }
        entity.password = document.getElementById("password").value;
        if (entity.password == null || entity.password.length <= 0) {
            msg.textContent = "Password can not be null";
            loginError.style.visibility = "visible";
            $("#loginError").fadeTo(0,1);
            $("#loginError").fadeOut(5000);
            $("#loginError").fadeTo(100,0);
            $(msg).show();
            return false;
        }
        entity.rememberme = document.getElementById("rememberMe").checked;
                //将请求体以及url进行aes加密
        let result;
        try {
            if (captchaEnable) {
                result = await new Promise(resolve => {
                    var id = setInterval(function () {
                        var loginResult = waitLogin(url, entity, id);
                        if (loginResult) {
                            resolve(loginResult);
                        }
                    }, 50);
                })
            } else {
                result = JSON.parse(encryptionRequest(url, "POST", entity));
            }
        } catch (error) {
            return false;
        }
        if (result.succeed) {
            if (result.anotherPlaceLogin) {
                msg.textContent = "detected that the current user is logging in the another place";
                $(msg).show();
                loginError.style.visibility = "visible";
                $("#loginError").fadeTo(0,1);
                $("#loginError").fadeOut(5000);
                $("#loginError").fadeTo(100,0);
                setTimeout(function () {
                    location.href = result.referer;
                    $(msg).hide()
                }, 5000)
            } else {
                var resultRef = result.referer;
                // 如login请求上一次请求是setup，自然无需再跳回setup，跳到首页即可。
                if (resultRef.indexOf("/setup") >= 0) {
                    resultRef = "/";
                }
                location.href = resultRef;
                $(msg).hide();
            }
        } else {
            if (result.pwdMustModify) {
                window.localStorage.setItem("lockedUser", entity.username);
                SuperMapServer.Dialog.alert("Please reset your password", "You have encountered the following situations and need to reset your password:\n 1.Log in to the account assigned by the administrator for the first time \n 2.Password has expired \n 3.Password has been reset by administrator \n\n Please click the OK button to jump to the reset password page", function () {
                    location.href = getIServerUrl() + "/services/security/profile";
                });
            } else if (result.reason) {
                msg.textContent = result.reason;
            } else {
                msg.textContent = "Error user name or password";
            }
            $(msg).show();
            loginError.style.visibility = "visible";
            $("#loginError").fadeTo(0,1);
            $("#loginError").fadeOut(5000);
            $("#loginError").fadeTo(100,0);
            return false;
        }
    }

    function waitLogin(url, entity, id) {
        if (!isChecking) {
            clearInterval(id);
            if (captchaTicket) {
                var headers = [];
                var captchaTicketHeader = {
                    name: "captchaTicket",
                    value: captchaTicket
                };
                headers.push(captchaTicketHeader);
                return JSON.parse(encryptionRequest(url, "POST", entity, headers));
            } else {
                return {succeed: false};
            }
        }
        return null;
    }

    $(document).ready(function () {
        processCaptcha();
    });

    function processCaptcha() {
        var url = "http://8.130.175.232:18090/iserver/services/security".replace("/services", "") + "/captcha/config.json";
        $.ajax({
            type: "GET",
            url: url,
            async: false,
            dataType: "text",
            success: function (msg) {
                captchaConfig = json_parse(msg);
                if (captchaConfig.enable) {
                    captchaEnable = true;
                    initVerificationCode(captchaConfig);
                }
            }
        });
    }

    function initVerificationCode(imageCaptchaConfig) {
        var loginPage = document.getElementById('loginPage');
        var captchaTr = document.getElementById('captcha-tr');
        captchaTr.style.display = "-webkit-flex";
        var captchaInput = document.getElementById('captcha-input');
        captchaInput.maxLength = imageCaptchaConfig.length;
        var image = document.getElementById('captcha-img');
        image.src = getRootUrl().replace("/manager", "") + "security/captcha.json" + "?t=" + new Date().getTime();
        var captchaItem = document.getElementById('captcha-error');
        captchaInput.onchange = function () {
            captchaInputChange(imageCaptchaConfig, captchaInput, captchaItem);
        };
        captchaInput.onblur = function () {
            if (!captchaInput.value && captchaItem) {
                deleteErrorMsgElement(captchaItem);
                addErrorMsgElement(captchaItem, imageCaptchaRes.nullCaptcha);
                captchaInput.setAttribute('style', 'border:1px solid #E41318;');
            }
        };
        image.onclick = function () {
            imageOnclick(imageCaptchaConfig, captchaInput, captchaItem, image);
        };
        image.onload = function () {
            lastRefreshTime = Date.now();
        };
        loadLoginPage();
    }

    function captchaInputChange(imageCaptchaConfig, captchaInput, captchaItem) {
        isChecking = true;
        if (imageCaptchaConfig && imageCaptchaConfig.length === captchaInput.value.length) {
            verifyCaptcha(captchaInput, captchaItem);
        } else {
            deleteErrorMsgElement(captchaItem);
            captchaInput.setAttribute('style', 'border:1px solid #f5222d;');
            addErrorMsgElement(captchaItem, imageCaptchaRes.enterCaptchaError);
        }
    }

    function imageOnclick(imageCaptchaConfig, captchaInput, captchaItem, image) {
        if (imageCaptchaConfig && imageCaptchaConfig.refreshIntervalInSeconds) {
            var refreshIntervalInSeconds = imageCaptchaConfig.refreshIntervalInSeconds ? imageCaptchaConfig.refreshIntervalInSeconds * 1000 : 0;
            if (lastRefreshTime && Date.now() - lastRefreshTime >= refreshIntervalInSeconds) {
                image.src = getRootUrl().replace("/manager", "") + "security/captcha.json" + "?t=" + new Date().getTime();
            } else {
                deleteErrorMsgElement(captchaItem);
                addErrorMsgElement(captchaItem, imageCaptchaRes.tooManyCaptchaRequests);
                setTimeout(() => {
                    if (getCaptchaErrorMsgTip(captchaItem) === imageCaptchaRes.tooManyCaptchaRequests) {
                        deleteErrorMsgElement(captchaItem);
                    }
                }, 2000);
            }
        }
    }

    function deleteErrorMsgElement(captchaItem) {
        if (captchaItem && captchaItem.childElementCount > 0) {
            var lastElementChild = captchaItem.lastElementChild;
            captchaItem.removeChild(lastElementChild);
            var rememberMeAndForgetPass = document.getElementById("rememberMeAndForgetPass");
            rememberMeAndForgetPass.style = "margin:0 0 56px 0;";
        }
    }

    function addErrorMsgElement(captchaItem, msg) {
        if (captchaItem) {
            var tipDiv = document.createElement('span');
            var newTip = document.createTextNode(msg);
            tipDiv.appendChild(newTip);
            captchaItem.appendChild(tipDiv);
            var rememberMeAndForgetPass = document.getElementById("rememberMeAndForgetPass");
            rememberMeAndForgetPass.style = "margin:24px 0 33px 0;";
        }
    }

    function verifyCaptcha(captchaInput, captchaItem) {
        var url = getRootUrl().replace("/services", "").replace("/manager", "") + "security/captcha.json";
        $.ajax({
            type: "POST",
            url: url,
            async: false,
            data: captchaInput.value,
            dataType: "text",
            success: function (data) {
                deleteErrorMsgElement(captchaItem);
                captchaInput.setAttribute('style', '');
                captchaTicket = data;
                isChecking = false;
            }, error: function (error) {
                deleteErrorMsgElement(captchaItem);
                captchaInput.setAttribute('style', 'border:1px solid #E41318;');
                var msg = error.responseText;
                var errorEntity = json_parse(msg);
                addErrorMsgElement(captchaItem, errorEntity.error.errorMsg);
                var image = document.getElementById('captcha-img');
                image.src = getRootUrl().replace("/manager", "") + "security/captcha.json" + "?t=" + new Date().getTime();
            }
        });
    }

    function getCaptchaErrorMsgTip(captchaItem) {
        if (captchaItem && captchaItem.childElementCount) {
            var lastElementChild = captchaItem.lastElementChild;
            return lastElementChild.innerText;
        }
        return '';
    }
</script>
