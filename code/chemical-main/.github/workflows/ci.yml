name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-audit:
    name: Python lint and repository audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync locked runtime dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Ruff check
        run: uvx ruff@0.11.13 check algorithm/

      - name: Repository hygiene audit
        run: uv run --frozen python tools/audit_repository.py

      - name: Code quality audit
        run: uv run --frozen python tools/code_quality_audit.py

  algorithm-tests:
    name: Python algorithm tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync locked runtime dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: D* Lite planning validation
        run: uv run --frozen python -m algorithm.planning.test_dstar_lite

      - name: Particle-filter inversion validation
        run: uv run --frozen python -m algorithm.inversion.validate_particle_filter

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Strict typecheck
        run: npm run typecheck:strict

      - name: Build
        run: npm run build

  backend-build:
    name: Backend compile and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -q compile

      - name: Test
        run: mvn -q test
