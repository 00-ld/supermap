<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SuperMap S3M 同源代理最小测试</title>
  <!-- Keep this test on the exact iPortal SDK build used by the application. -->
  <link rel="stylesheet" href="/supermap3d/Widgets/widgets.css" />
  <style>
    html,body,#viewer{width:100%;height:100%;margin:0;overflow:hidden;background:#17191f;font-family:Arial,"Microsoft YaHei",sans-serif}
    #panel{position:absolute;z-index:10;top:12px;left:12px;width:min(780px,calc(100vw - 48px));padding:12px;background:rgba(20,23,29,.95);color:#f3f4f6;border:1px solid #555;border-radius:6px;box-sizing:border-box}
    #configUrl{width:100%;box-sizing:border-box;margin:6px 0 8px;padding:8px;background:#0f1116;color:#fff;border:1px solid #666;border-radius:4px}
    button{padding:7px 12px;margin-right:6px;border:0;border-radius:4px;cursor:pointer}
    #log{max-height:240px;overflow:auto;margin-top:10px;padding:8px;background:#0f1116;border-radius:4px;white-space:pre-wrap;word-break:break-all;font:12px/1.45 Consolas,monospace}
    .hint{margin-top:8px;color:#c8cdd4;font-size:12px}
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="panel">
    <strong>SuperMap S3M 同源代理最小测试</strong>
    <input id="configUrl" value="/iserver/services/3D-local3DCache-YuanCaiLiaoCangKu/rest/realspace/datas/result_ImportFBX/config" />
    <button id="healthBtn">检查代理</button>
    <button id="loadBtn">加载 S3M</button>
    <button id="flyBtn" disabled>飞到图层</button>
    <button id="clearBtn">清空日志</button>
    <div class="hint">Network 中的 Request URL 应以 http://127.0.0.1:5173/iserver/ 开头，不应直接请求任何远端 iServer。</div>
    <div id="log"></div>
  </div>

  <script>
    // SuperMap3D resolves workers, Assets and the iServer license request from this root.
    // Set it before loading the SDK; deriving it from a Vite proxy URL is unreliable.
    window.CESIUM_BASE_URL = '/supermap3d/'
  </script>
  <script src="/supermap3d/SuperMap3D.js"></script>
  <script>
    (() => {
      "use strict";
      const runtime = window.SuperMap3D || window.Cesium;
      const configInput = document.getElementById("configUrl");
      const healthBtn = document.getElementById("healthBtn");
      const loadBtn = document.getElementById("loadBtn");
      const flyBtn = document.getElementById("flyBtn");
      const clearBtn = document.getElementById("clearBtn");
      const logBox = document.getElementById("log");
      let viewer = null;
      let layer = null;

      function log(message, value) {
        const time = new Date().toLocaleTimeString();
        let extra = "";
        if (value !== undefined) {
          try { extra = "\n" + (typeof value === "string" ? value : JSON.stringify(value, null, 2)); }
          catch { extra = "\n[对象无法序列化，请查看 Console]"; }
        }
        logBox.textContent += `[${time}] ${message}${extra}\n`;
        logBox.scrollTop = logBox.scrollHeight;
        console.log("[S3M proxy minimal]", message, value ?? "");
      }

      function timeout(promise, ms, label) {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new Error(`${label}，超过 ${ms}ms`)), ms)),
        ]);
      }

      async function checkProxy() {
        const url = configInput.value.trim();
        try {
          const response = await fetch(url, {
            cache: "no-store",
            credentials: "same-origin",
          });
          const text = await response.text();
          log("代理检查完成", {
            url: response.url,
            status: response.status,
            ok: response.ok,
            contentType: response.headers.get("content-type"),
            textLength: text.length,
            responseHead: text.slice(0, 600),
          });
        } catch (error) {
          console.error(error);
          log("代理检查失败", error instanceof Error ? {
            name: error.name,
            message: error.message,
          } : String(error));
        }
      }

      async function fly() {
        if (!viewer || !layer) return log("没有可飞行的图层");
        try {
          await viewer.flyTo(layer);
          log("viewer.flyTo 完成");
        } catch (error) {
          console.error(error);
          log("viewer.flyTo 失败", error instanceof Error ? error.message : String(error));
        }
      }

      async function load() {
        const url = configInput.value.trim();
        if (!url) return log("config URL 不能为空");
        loadBtn.disabled = true;
        flyBtn.disabled = true;
        layer = null;
        log("开始 addS3MTilesLayerByScp", url);

        try {
          const result = await timeout(
            Promise.resolve(viewer.scene.addS3MTilesLayerByScp(url, {
              name: `原材料仓库-proxy-${Date.now()}`,
            })),
            60000,
            "S3M 图层 Promise 返回超时",
          );

          if (!result) throw new Error("Promise 返回空图层");
          layer = result;
          flyBtn.disabled = false;
          log("S3M 图层 Promise 已返回", {
            name: layer.name,
            visible: layer.visible,
            hasBoundingSphere: Boolean(layer.boundingSphere),
            sceneLayerCount: viewer.scene.layers?.length ?? null,
          });
          await fly();
        } catch (error) {
          console.error(error);
          log("S3M 加载失败", error instanceof Error ? {
            name: error.name,
            message: error.message,
            stack: error.stack,
            sceneLayerCount: viewer?.scene?.layers?.length ?? null,
          } : String(error));
        } finally {
          loadBtn.disabled = false;
        }
      }

      try {
        if (!runtime || typeof runtime.Viewer !== "function") {
          throw new Error("未找到 SuperMap3D/Cesium Viewer");
        }

        viewer = new runtime.Viewer("viewer", {
          animation:false,timeline:false,baseLayerPicker:false,geocoder:false,
          homeButton:false,navigationHelpButton:false,sceneModePicker:false,
          fullscreenButton:false,infoBox:false,selectionIndicator:false,shouldAnimate:false
        });

        if (!viewer.scene || typeof viewer.scene.addS3MTilesLayerByScp !== "function") {
          throw new Error("当前 SDK 未暴露 scene.addS3MTilesLayerByScp");
        }

        window.__s3mProxyMinimalTest = {
          runtime,
          viewer,
          getLayer: () => layer,
          checkProxy,
          load,
          fly,
        };

        log("Viewer 创建成功，请先点击“检查代理”");
      } catch (error) {
        console.error(error);
        log("初始化失败", error instanceof Error ? error.message : String(error));
        healthBtn.disabled = true;
        loadBtn.disabled = true;
      }

      healthBtn.addEventListener("click", () => void checkProxy());
      loadBtn.addEventListener("click", () => void load());
      flyBtn.addEventListener("click", () => void fly());
      clearBtn.addEventListener("click", () => { logBox.textContent = ""; });
    })();
  </script>
</body>
</html>
