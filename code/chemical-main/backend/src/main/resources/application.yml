spring:
  application:
    name: chemical-park-monitor
  # 本地运行默认走 local profile；生产环境显式设置 SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # 默认连本地 3306 的 chemical 库；本地 MySQL 用 root/空密码开发时可覆盖 DB_USERNAME/DB_PASSWORD
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/chemical?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8081}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.at.pojo
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

analysis:
  service:
    url: ${ANALYSIS_SERVICE_URL:}

inspection:
  default-location: ${INSPECTION_DEFAULT_LOCATION:核心作业区 A7}

algorithm:
  api-key: ${ALGORITHM_API_KEY:}

qweather:
  api-key: ${QWEATHER_API_KEY:}
  location: ${QWEATHER_LOCATION:}
  api-host: ${QWEATHER_API_HOST:https://devapi.qweather.com}
  auth-mode: ${QWEATHER_AUTH_MODE:key}
  language: ${QWEATHER_LANG:zh}
  unit: ${QWEATHER_UNIT:m}

qwen:
  # 密钥仅由后端进程读取，禁止写入前端、移动端 APK 或版本库。
  api-key: ${DASHSCOPE_API_KEY:}
  endpoint: ${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  model: ${DASHSCOPE_MODEL:qwen-plus}
  knowledge-base-path: ${AI_KNOWLEDGE_BASE_PATH:}
