[project]
name = "chemical-park-monitoring"
version = "1.0.0"
description = "化工园区智能监测系统 - Python 算法模块"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "numpy>=2.4.3",
    "pydantic>=2.12.5",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "polars>=1.39.3",
    "requests>=2.32.5",
    "python-multipart>=0.0.22",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.2",
    "sympy>=1.14.0",
    "psutil>=7.2.2",
    "websockets>=16.0",
    "joblib>=1.5.3",
    "pandas",
]

[project.optional-dependencies]
yolo = [
    "opencv-python>=4.13.0.92",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "ultralytics>=8.4.28",
]
test = [
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    # Existing algorithm modules intentionally keep long scientific formulas and
    # sys.path bootstrap imports; keep CI focused on semantic Python errors.
    "E402",
    "E501",
    "I001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
