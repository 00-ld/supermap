# ===== Android / Gradle =====
# -Xmx 控制在 3g，避免编译期 C2 CompilerThread 在 16G 物理内存机器上 native OOM（曾 -Xmx4096m 触发 hs_err）。
# ReservedCodeCacheSize 提升到 512m，防止编译大工程时代码缓存不足导致频繁去优化。
org.gradle.jvmargs=-Xmx3072m -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 指定 Gradle daemon 用 JDK 21（本机 JAVA_HOME 默认 openjdk-25，Gradle 8.14.3 不支持 Java 25）
# JDK 21 被 Gradle 8.14.3 完整支持
org.gradle.java.home=C:/Program Files/Java/jdk-21

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# 不自动下载 SDK
android.builder.sdkDownload=false

# AGP 8 属性
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=34
# 项目路径含中文（竞赛/超图杯/移动端），AGP 8 路径检查 override
android.overridePathCheck=true
