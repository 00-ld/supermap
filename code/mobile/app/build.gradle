// 化工园区移动端 app 模块（AGP 8.5.2）
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.at.mobile'
    compileSdk 34

    // SuperMap DataDownloadService 内部依赖已废弃的 org.apache.http.*（BasicHttpParams 等），
    // targetSdk 28 默认不再打包该库 → NoClassDefFoundError 崩溃。
    // useLibrary 显式引入 Android 内置的 org.apache.http.legacy 静态库即可恢复。
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.at.mobile"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // .so 用默认 src/main/jniLibs 目录（armeabi-v7a 子目录），jar 由 fileTree 提供

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/*',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/INDEX.LIST',
                    'META-INF/DEPENDENCIES'
            ]
        }
        // org.apache.http.legacy.jar 内打包了老版 commons-codec 类，与 commons-codec-1.15.jar 冲突。
        // legacy jar 我们只需要其中的 org.apache.http.* 部分，commons-codec 重复类挑一个即可。
        pickFirst '**/org/apache/commons/codec/**.class'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // iMobile 2026 SDK + 自带 okhttp/gson（本地 jar，位于 src/main/libs）
    implementation fileTree(dir: 'src/main/libs', include: ['*.jar'])
    // AndroidX & UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // 运行时权限
    implementation 'pub.devrel:easypermissions:2.0.1'
    // Retrofit + Gson（okhttp 4.12.0 复用 SDK 自带 jar，版本一致无冲突）
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    // OkHttp 日志拦截器（SDK jar 未含此子包，单独引入，版本对齐 SDK 的 okhttp 4.12.0）
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
