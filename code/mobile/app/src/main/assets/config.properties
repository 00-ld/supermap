# 移动端运行时配置（AppConfig 读取，assets 打包进 APK，改后需重编译）
# 后端 Spring Boot 地址。
backend.baseurl=http://127.0.0.1:8081/
# SuperMap iServer 公网直连
iserver.baseurl=http://8.130.175.232:18090/iserver
# 园区二维 REST Map 服务地址（CGCS2000 版，PCS_NON_EARTH 米制）
iserver.map.url=http://8.130.175.232:18090/iserver/services/map-chemical_park_vectors_cgcs2000/rest/maps/%E5%BB%BA%E7%AD%91%E5%8D%95%E4%BD%93%E6%A0%A1%E6%A0%B8%E5%9B%BE_CGCS2000
# 园区 REST Data 服务
iserver.data.url=http://8.130.175.232:18090/iserver/services/data-chemical_park_vectors_cgcs2000/rest
# 园区三维场景服务（3D 化工园区场景，含贴图建筑模型）
iserver.scene.url=http://8.130.175.232:18090/iserver/services/3D-local3DCache-HuaGongYuanQuChangJing/rest
iserver.scene.name=默认场景
# 3D 单体设备场景（可单独加载）
iserver.scene.tower.name=3D-local3DCache-ZhengLiuTa
iserver.scene.tank.name=3D-local3DCache-LiShiGuanZi
iserver.scene.heater.name=3D-local3DCache-HuanReQi
iserver.scene.warehouse.name=3D-local3DCache-YuanCaiLiaoCangKu
# 中国底图服务（WMTS，用于叠加底图，坐标系为 Web Mercator EPSG:3857）
iserver.basemap.url=http://8.130.175.232:18090/iserver/services/map-china/wmts-china
iserver.basemap.layer=ChinaLight
# 地图坐标系：PCS_NON_EARTH 本地米制（epsgCode=-1000）
map.epsg=-1000
# 地图范围（米制）
map.bounds.left=457091.92
map.bounds.bottom=3854317.55
map.bounds.right=459999.97
map.bounds.top=3857225.59
map.center.x=458545.94
map.center.y=3855771.57
# 网络超时（毫秒）
http.connect.timeout=15000
http.read.timeout=30000
# 调试日志开关
debug.log=true
